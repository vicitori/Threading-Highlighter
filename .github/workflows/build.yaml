name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# Cancel in-progress runs for the same branch/PR to save resources
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble project and agent jar
        run: ./gradlew assemble :agent:shadowJar --no-daemon

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # required to publish the JUnit report as a check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}    # publish results even when tests fail
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin --no-daemon

      - name: Upload verifier report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pluginVerifier-report
          path: plugin/build/reports/pluginVerifier/
          retention-days: 7
