name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR to save resources
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default
permissions:
  contents: read

jobs:
  # Build, style check and tests share one checkout/JDK/Gradle setup: splitting them
  # into separate jobs re-provisions the toolchain each time for no real benefit.
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # required to publish the JUnit report as a check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Assemble project and agent jar
        run: ./gradlew assemble :agent:shadowJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}    # publish results even when tests fail
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
